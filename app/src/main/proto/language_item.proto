syntax = "proto3";

option java_package = "com.example.translator";
option java_multiple_files = true;

message PairLanguageStore {
    LanguageItemStore fromLanguageItemStore = 1;
    LanguageItemStore toLanguageItemStore = 2;
}

message LanguageItemStore {
    string language_name = 1;
    string language_code = 2;
    int32 downloaded = 3;
}