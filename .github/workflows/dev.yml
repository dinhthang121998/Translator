name: Run dev

on:
  pull_request:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code to specific branch
        uses: actions/checkout@v4

      - name: Set up jdk 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Run unit tests
        run: ./gradlew clean testDebug